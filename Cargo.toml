[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop"]

[workspace.package]
edition = "2024"
version = "0.6.0-beta.2"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
xcpc-domain = { path = "crates/xcpc-domain" }
xcpc-trace = { path = "crates/xcpc-trace" }
xcpc-storage = { path = "crates/xcpc-storage" }
xcpc-lint = { path = "crates/xcpc-lint" }
xcpc-convert = { path = "crates/xcpc-convert" }
xcpc-engine = { path = "crates/xcpc-engine" }
xcpc-judge = { path = "crates/xcpc-judge" }
xcpc-packages = { path = "crates/xcpc-packages" }
xcpc-plugin = { path = "crates/xcpc-plugin" }
xcpc-sync = { path = "crates/xcpc-sync" }
xcpc-app = { path = "crates/xcpc-app" }

nsh-core = "0.7.1"
nsh-base = { version = "0.7.1", default-features = false }

typst = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
tiny-skia = "0.12"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts", "system-packages", "system-downloader"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
comemo = "0.5.1"
siphasher = "1"
ttf-parser = "0.25"

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.22"
sha2 = "0.10"
notify = "8"
tempfile = "3"
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false }
mitex = "0.2.4"
imagesize = "0.15"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.47", default-features = false }
rquickjs = "0.14"
ureq = "2"
scraper = "0.29"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
