[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
xcpc-engine = { path = "crates/xcpc-engine" }

nsh-core = "0.6.0"
nsh-base = "0.6.0"

typst = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
tiny-skia = "0.12"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts"] }
comemo = "0.5.1"
siphasher = "1"
ttf-parser = "0.25"

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
