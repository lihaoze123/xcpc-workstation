[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
xcpc-domain = { path = "crates/xcpc-domain" }
xcpc-storage = { path = "crates/xcpc-storage" }
xcpc-convert = { path = "crates/xcpc-convert" }
xcpc-engine = { path = "crates/xcpc-engine" }

nsh-core = "0.6.0"
nsh-base = { version = "0.6.0", default-features = false }

typst = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
tiny-skia = "0.12"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts"] }
comemo = "0.5.1"
siphasher = "1"
ttf-parser = "0.25"

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tempfile = "3"
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false }
mitex = "0.2.4"
