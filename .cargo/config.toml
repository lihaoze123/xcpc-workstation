# Dev builds keep workspace crates debuggable with compact line tables while optimizing
# all third-party dependencies (`nsh-*`, `taffy`, `ropey`, `rustybuzz`, `typst-*`, etc.)
# so `nsh dev` editor typing and Typst/CeTZ preview remain responsive. Placed here rather
# than in `Cargo.toml` so it also reaches `apps/desktop/.nsh/rust`, whose workspace is separate.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = 0

# Applies to both the root workspace (`xcpc`) and `apps/desktop/.nsh/rust`
# generated by `nsh`. Thin LTO with parallel codegen keeps release builds fast
# while preserving small binary size (`opt-level = "z"`, `strip = true`, `panic = "abort"`).
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

# Fast optimized profile for local performance benchmarks & regression gates
# without paying full fat-LTO / single-CGU release link times.
[profile.bench-fast]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
strip = false
panic = "unwind"

# Match `nsh package --target windows` so `xcpc.exe` also ships without a
# runtime dependency on VCRUNTIME140.dll.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
