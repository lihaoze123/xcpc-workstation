# Typst's layout and rasterizer are unusably slow unoptimized; our own crates stay
# debuggable. Here rather than in `Cargo.toml` so it also reaches the workspace `nsh`
# generates for the desktop hosts (`apps/desktop/.nsh/rust`), whose profiles are its own.
[profile.dev.package."*"]
opt-level = 2

# Applies to both the root workspace (`xcpc`) and `apps/desktop/.nsh/rust`
# generated by `nsh`.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Match `nsh package --target windows` so `xcpc.exe` also ships without a
# runtime dependency on VCRUNTIME140.dll.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
