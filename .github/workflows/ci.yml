name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NSH_VERSION: "0.7.1"

jobs:
  rust-core:
    name: Rust Core (clippy & test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install CJK & Latin Modern fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk lmodern libssl-dev pkg-config

      - name: Cache bundled fonts
        uses: actions/cache@v4
        with:
          path: ~/.cache/xcpc-bundled-fonts
          key: xcpc-bundled-fonts-${{ runner.os }}-v3

      - name: Fetch bundled fonts
        run: |
          python3 scripts/fetch-bundled-fonts.py "$HOME/.cache/xcpc-bundled-fonts"
          echo "XCPC_FONT_DIRS=/usr/share/texmf/fonts/opentype/public/lm:$HOME/.cache/xcpc-bundled-fonts:/usr/share/fonts/opentype/noto" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --exclude xcpc-desktop --all-targets -- -D warnings

      - name: Unit & integration tests
        run: cargo test --workspace --exclude xcpc-desktop

  desktop:
    name: Desktop (nsh check & test)
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GTK4 / WebKitGTK 6.0 & font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libssl-dev \
            pkg-config \
            fonts-noto-cjk \
            lmodern

      - name: Cache bundled fonts
        uses: actions/cache@v4
        with:
          path: ~/.cache/xcpc-bundled-fonts
          key: xcpc-bundled-fonts-${{ runner.os }}-v3

      - name: Fetch bundled fonts
        run: |
          python3 scripts/fetch-bundled-fonts.py "$HOME/.cache/xcpc-bundled-fonts"
          echo "XCPC_FONT_DIRS=/usr/share/texmf/fonts/opentype/public/lm:$HOME/.cache/xcpc-bundled-fonts:/usr/share/fonts/opentype/noto" >> "$GITHUB_ENV"

      - name: Cache NSH CLI
        id: cache-nsh
        uses: actions/cache@v4
        with:
          path: ~/.local/nsh
          key: nsh-linux-x86_64-${{ env.NSH_VERSION }}

      - name: Install NSH CLI
        if: steps.cache-nsh.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/nsh
          curl -fsSL "https://github.com/longbridge/nsh/releases/download/v${NSH_VERSION}/nsh-linux-x86_64.tar.gz" \
            | tar -xz -C ~/.local/nsh

      - name: Add NSH to PATH
        run: |
          NSH_BIN=$(dirname "$(find "$HOME/.local/nsh" -name nsh -type f | head -n 1)")
          test -n "$NSH_BIN"
          echo "$NSH_BIN" >> "$GITHUB_PATH"
          "$NSH_BIN/nsh" --version

      - name: Cache NSH packages
        uses: actions/cache@v4
        with:
          path: ~/.nsh/nshms
          key: nshms-${{ runner.os }}-${{ hashFiles('apps/desktop/nsh.lock') }}
          restore-keys: |
            nshms-${{ runner.os }}-

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/.nsh/rust -> apps/desktop/.nsh/rust/target

      - name: Type check & headless tests
        working-directory: apps/desktop
        run: |
          nsh check
          nsh test

  macos:
    name: macOS arm64 (Rust & Desktop)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache bundled fonts
        uses: actions/cache@v4
        with:
          path: ~/.cache/xcpc-bundled-fonts
          key: xcpc-bundled-fonts-${{ runner.os }}-v3

      - name: Fetch bundled fonts
        run: |
          python3 scripts/fetch-bundled-fonts.py "$HOME/.cache/xcpc-bundled-fonts"
          echo "XCPC_FONT_DIRS=$HOME/.cache/xcpc-bundled-fonts:/System/Library/Fonts:/System/Library/Fonts/Supplemental" >> "$GITHUB_ENV"

      - name: Cache NSH CLI
        id: cache-nsh
        uses: actions/cache@v4
        with:
          path: ~/.local/nsh
          key: nsh-macos-arm64-${{ env.NSH_VERSION }}

      - name: Install NSH CLI
        if: steps.cache-nsh.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/nsh
          curl -fsSL "https://github.com/longbridge/nsh/releases/download/v${NSH_VERSION}/nsh-macos-arm64.tar.gz" \
            | tar -xz -C ~/.local/nsh

      - name: Add NSH to PATH
        run: |
          NSH_BIN=$(dirname "$(find "$HOME/.local/nsh" -name nsh -type f | head -n 1)")
          test -n "$NSH_BIN"
          echo "$NSH_BIN" >> "$GITHUB_PATH"
          "$NSH_BIN/nsh" --version

      - name: Cache NSH packages
        uses: actions/cache@v4
        with:
          path: ~/.nsh/nshms
          key: nshms-${{ runner.os }}-${{ hashFiles('apps/desktop/nsh.lock') }}
          restore-keys: |
            nshms-${{ runner.os }}-

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/.nsh/rust -> apps/desktop/.nsh/rust/target

      - name: Clippy
        run: cargo clippy --workspace --exclude xcpc-desktop --all-targets -- -D warnings

      - name: Unit & integration tests
        run: cargo test --workspace --exclude xcpc-desktop

      - name: Desktop type check & headless tests
        working-directory: apps/desktop
        run: |
          nsh check
          nsh test
