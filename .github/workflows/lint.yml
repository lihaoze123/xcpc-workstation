name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  scripts:
    name: Shell & Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bash syntax
        run: bash -n scripts/*.sh packaging/linux/*.sh packaging/macos/*.sh
      - name: Run shellcheck
        run: shellcheck -e SC2086 scripts/*.sh packaging/linux/*.sh packaging/macos/*.sh
      - name: Check Python syntax
        run: python3 -m py_compile scripts/*.py
      - name: Check plugin docs
        run: python3 scripts/check-plugin-docs.py

  conventional-commits:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "PR title must follow Conventional Commits: $PR_TITLE" >&2
            exit 1
          fi
