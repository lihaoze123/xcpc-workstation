id = "complexity-mem"
name = "复杂度与内存估算"
version = "1.0.0"
description = "离线估算常见算法时间复杂度运算量边界与数组精确内存占用。"
author = "XCPC Workstation"
entry = "index.js"
capabilities = ["tool"]

[permissions]
domains = []
workspace_read = false

[[tools]]
id = "complexity"
name = "时间复杂度估算"
description = "根据数据规模 n、时限与常数因子估算各复杂度运算量与可行性。"

[[tools.inputs]]
name = "n"
label = "数据规模 n"
kind = "number"
default = 100000
required = true

[[tools.inputs]]
name = "time_limit_sec"
label = "时间限制 (s)"
kind = "number"
default = 1
required = false

[[tools.inputs]]
name = "const_factor"
label = "常数因子"
kind = "number"
default = 1
required = false

[[tools]]
id = "memory"
name = "数组内存估算"
description = "计算指定数据类型与多维数组尺寸的精确字节、KiB、MiB 与占比。"

[[tools.inputs]]
name = "data_type"
label = "数据类型"
kind = "select"
default = "int64"
options = ["bool", "char", "int16", "int32", "int64", "int128", "float", "double", "long_double", "pair_int32", "pair_int64"]
required = true

[[tools.inputs]]
name = "dimensions"
label = "数组维度（如 200005 或 1000x1000）"
kind = "string"
default = "1000000"
required = true

[[tools.inputs]]
name = "limit_mb"
label = "内存限制 (MiB)"
kind = "number"
default = 256
required = false
