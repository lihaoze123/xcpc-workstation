id = "graph-editor"
name = "图论与几何画板"
version = "1.0.0"
description = "画图、拖拽、导出图片"
author = "XCPC Workstation"
entry = "index.js"
ui_entry = "ui.js"
capabilities = ["tool", "commands"]

[permissions]
domains = []
workspace_read = false

[[commands]]
id = "open"
title = "打开图论画板"
context = "global"

[[tools]]
id = "parse-graph"
name = "解析图并渲染 SVG"
description = "将边表、父数组、邻接表或点坐标解析为图结构与矢量图。"

[[tools.inputs]]
name = "format"
label = "输入格式"
kind = "select"
default = "edge_list"
options = ["edge_list", "parent_array", "adj_list", "coords"]
required = true

[[tools.inputs]]
name = "text"
label = "图描述文本"
kind = "textarea"
default = "1 2 5\n1 3 2\n2 4 1\n2 5 4\n3 5 3"
required = true

[[tools.inputs]]
name = "one_indexed"
label = "从 1 开始编号"
kind = "boolean"
default = true
required = false

[[tools.inputs]]
name = "directed"
label = "有向图"
kind = "boolean"
default = false
required = false

[[tools.inputs]]
name = "weighted"
label = "带权图"
kind = "boolean"
default = true
required = false

[[tools.inputs]]
name = "layout"
label = "布局算法"
kind = "select"
default = "force"
options = ["force", "tree", "circle", "coords"]
required = false
