id = "graph-editor"
name = "图论与几何画板"
version = "1.0.0"
description = "对标 another_graph_editor：边表 / 父数组 / 邻接表 / 几何坐标与画布双向联动，支持拖拽、着色、树/力导向布局及导出 SVG/PNG。"
author = "XCPC Workstation"
entry = "index.js"
ui_entry = "ui.js"
capabilities = ["tool", "commands"]

[permissions]
domains = []
workspace_read = false

[[commands]]
id = "open"
title = "打开图论画板"
context = "global"

[[tools]]
id = "parse-graph"
name = "解析图并渲染 SVG"
description = "将边表、父数组、邻接表或坐标文本解析为标准图结构与矢量 SVG。"

[[tools.inputs]]
name = "format"
label = "输入格式"
kind = "select"
default = "edge_list"
options = ["edge_list", "parent_array", "adj_list", "coords"]
required = true

[[tools.inputs]]
name = "text"
label = "图描述文本"
kind = "textarea"
default = "1 2 5\n1 3 2\n2 4 1\n2 5 4\n3 5 3"
required = true

[[tools.inputs]]
name = "one_indexed"
label = "1-indexed 编号"
kind = "boolean"
default = true
required = false

[[tools.inputs]]
name = "directed"
label = "有向图"
kind = "boolean"
default = false
required = false

[[tools.inputs]]
name = "weighted"
label = "带权图"
kind = "boolean"
default = true
required = false

[[tools.inputs]]
name = "layout"
label = "布局算法"
kind = "select"
default = "force"
options = ["force", "tree", "circle", "coords"]
required = false
